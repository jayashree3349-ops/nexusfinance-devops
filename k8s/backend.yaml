apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusfinance-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexusfinance-backend
  template:
    metadata:
      labels:
        app: nexusfinance-backend
    spec:
      containers:
        - name: backend
          image: nexusfinance-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nexusfinance-backend
spec:
  selector:
    app: nexusfinance-backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
