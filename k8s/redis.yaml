apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusfinance-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexusfinance-redis
  template:
    metadata:
      labels:
        app: nexusfinance-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nexusfinance-redis
spec:
  selector:
    app: nexusfinance-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access-policy
spec:
  podSelector:
    matchLabels:
      app: nexusfinance-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nexusfinance-backend
        - podSelector:
            matchLabels:
              app: nexusfinance-backend-green
      ports:
        - protocol: TCP
          port: 6379
